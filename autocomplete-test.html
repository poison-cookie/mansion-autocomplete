<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autocomplete Test</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #172033;
    }
    main {
      width: min(760px, calc(100vw - 32px));
      margin: 56px auto;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 28px;
      font-weight: 700;
    }
    form {
      display: grid;
      gap: 18px;
      padding: 24px;
      background: #fff;
      border: 1px solid #d7dde7;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #42526b;
    }
    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #aeb8c7;
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
      color: #111827;
    }
    input:focus,
    textarea:focus {
      outline: 3px solid #bfdbfe;
      border-color: #2563eb;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    button {
      border: 1px solid #1d4ed8;
      border-radius: 6px;
      padding: 10px 16px;
      background: #1d4ed8;
      color: #fff;
      font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    #result {
      min-height: 20px;
      color: #42526b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>入力欄テスト</h1>
    <form>
      <label>
        入力候補テスト
        <input id="building" type="text" autocomplete="off" placeholder="ここに入力">
      </label>
      <label>
        備考
        <textarea id="memo" rows="4" placeholder="テキストエリアでも確認"></textarea>
      </label>
      <div class="actions">
        <button id="search" type="button">検索</button>
      </div>
      <div id="result" aria-live="polite"></div>
    </form>
  </main>
  <script src="./mansion-autocomplete.user.js?v=20260612-button-visibility-shortcut"></script>
  <script>
    document.querySelector('#search').addEventListener('click', () => {
      document.querySelector('#result').textContent =
        `検索しました: ${document.querySelector('#building').value}`;
    });
  </script>
</body>
</html>
